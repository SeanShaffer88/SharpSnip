name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release, warnings as errors)
        run: dotnet build Snipit.sln -c Release
      - name: Self-test (pure logic)
        run: dotnet run --project tests/Snipit.SelfTest -c Release
